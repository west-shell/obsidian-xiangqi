name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open a .pgn file
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      description: Check in Settings → Community Plugins → Chinese Chess
      placeholder: "4.5.3"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian Version
      description: Check in Settings → About
      placeholder: "1.7.x"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
    validations:
      required: true
  - type: textarea
    id: related-code
    attributes:
      label: Code Block / PGN Content
      description: If applicable, paste the code block or PGN content that triggers the issue
      render: markdown
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console Logs
      description: |
        Open DevTools (Ctrl+Shift+I / Cmd+Option+I), reproduce the issue, then paste any errors from the Console tab.
      render: shell
    validations:
      required: false
